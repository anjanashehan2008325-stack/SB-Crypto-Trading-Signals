<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />
  <!-- Hexagon / Diamond Crest -->
  <polygon points="256,70 415,160 415,352 256,442 97,352 97,160" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />
  <!-- Candlesticks -->
  <line x1="165" y1="210" x2="165" y2="330" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <rect x="156" y="235" width="18" height="65" rx="3" fill="url(#bullGrad)" />
  <line x1="210" y1="180" x2="210" y2="310" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <rect x="201" y="200" width="18" height="75" rx="3" fill="url(#bullGrad)" />
  <line x1="302" y1="150" x2="302" y2="280" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <rect x="293" y="165" width="18" height="85" rx="3" fill="url(#bullGrad)" />
  <line x1="347" y1="120" x2="347" y2="260" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
  <rect x="338" y="135" width="18" height="95" rx="3" fill="url(#bullGrad)" />
  <!-- Monogram -->
  <g transform="translate(256, 320) scale(1.1)">
    <rect x="-90" y="-32" width="180" height="60" rx="14" fill="#0B1120" stroke="rgba(245, 158, 11, 0.6)" stroke-width="2" />
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">SB</text>
    <text x="0" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">CRYPTO</text>
  </g>
</svg>
